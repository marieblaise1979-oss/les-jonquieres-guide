<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244936">
  <meta name="description" content="Les Jonquières : guide pratique des vacanciers à Gerbépal, randonnées, fermes-auberges, restaurants, sorties et bonnes adresses dans les Vosges.">
  <title>Les Jonquières — Votre guide des Hautes-Vosges</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
    :root{font-family:'DM Sans',system-ui,sans-serif;color:#24402f;background:#f7f6f0;--green:#244936;--olive:#54745c;--line:#e5e9df;--cream:#f7f6f0;--rust:#b87a5c}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400}p{line-height:1.65}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c98e62;outline-offset:3px}
    header{background:#fffcf6;border-bottom:1px solid var(--line);padding:19px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;color:var(--green);padding:0}.brand-logo{font-size:29px;color:var(--rust)}.brand strong{font:29px 'DM Serif Display',Georgia,serif;display:block;line-height:1}.brand small{font-size:10px;letter-spacing:.09em;text-transform:uppercase;display:block;margin-top:5px}.header-label{font-size:11px;color:var(--olive);letter-spacing:.15em;font-weight:700}
    nav{position:sticky;top:0;z-index:10;background:#fffdf9ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav-inner{display:flex;gap:5px;overflow:auto;margin:auto;max-width:1160px;padding:9px 15px;scrollbar-width:none}.nav-inner::-webkit-scrollbar{display:none}nav button{border:0;background:transparent;color:#567260;border-radius:25px;font-size:12px;padding:10px 13px;white-space:nowrap}nav button.active{background:var(--green);color:white}
    .hero{min-height:480px;display:grid;grid-template-columns:42% 58%;overflow:hidden;background:#dfe6d5}.hero-picture{min-height:480px;background:linear-gradient(145deg,#bdcdb2,#e5e1c0);position:relative;display:flex;align-items:center;justify-content:center}.hero-sun{position:absolute;width:180px;height:180px;border-radius:50%;background:#f4e5b4;right:14%;top:15%}.mountain{position:absolute;bottom:-120px;left:-13%;width:80%;height:75%;background:#96a993;transform:rotate(45deg);border-radius:30px}.mountain.two{left:42%;bottom:-112px;background:#688e7b;transform:rotate(42deg)}.hero-tree{font-size:126px;position:absolute;bottom:8%;left:6%;filter:drop-shadow(0 6px 4px #1d4b3822)}.hero-tree.second{left:auto;right:9%;bottom:16%;font-size:95px}.hero-welcome{position:relative;z-index:2;font-size:74px;filter:drop-shadow(0 12px 5px #2a543325)}.hero-copy{padding:70px min(9%,85px);background:linear-gradient(125deg,#345b44,#1e4234);color:white;display:flex;flex-direction:column;justify-content:center}.eyebrow{letter-spacing:.18em;font-size:11px;font-weight:700;color:#e6d2b0;text-transform:uppercase}.hero h1{font-size:clamp(53px,6vw,83px);line-height:1.08;margin:23px 0}.hero h1 em{color:#e6c6a5;font-style:italic}.hero-copy p{font-size:16px;color:#e6efe6;max-width:530px}.cta{border:0;border-radius:40px;padding:16px 22px;background:#fff9ee;color:var(--green);font-weight:700;align-self:start;margin-top:23px}.cta span{margin-left:12px}
    .container{max-width:1150px;padding:0 24px;margin:0 auto}.intro{padding-top:69px;padding-bottom:30px}.intro h2{font-size:clamp(34px,4vw,49px);margin:13px 0}.intro h2 em{color:var(--rust)}.intro p{font-size:15px;color:#657767}.section-label{color:#aa7456;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
    .tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:32px 0 50px}.tile{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:#fffdf9;padding:0;text-align:left;box-shadow:0 8px 20px #2646370b;transition:transform .18s}.tile:hover{transform:translateY(-3px)}.tile-art{height:142px;display:grid;place-items:center;font-size:66px}.tile[data-category="randos"] .tile-art{background:#d1e0c8}.tile[data-category="auberges"] .tile-art{background:#e7d4b2}.tile[data-category="restaurants"] .tile-art{background:#f1d7c7}.tile[data-category="pluie"] .tile-art{background:#d4e4e9}.tile[data-category="agenda"] .tile-art{background:#e7d7e5}.tile[data-category="local"] .tile-art{background:#f1e2af}.tile-body{padding:19px 20px 22px;display:block}.tile-body small{font-size:10px;color:#b2785e;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.tile-body strong{display:block;font:26px 'DM Serif Display',Georgia,serif;margin:6px 0}.tile-body span{font-size:12px;color:#5d7a65}
    .welcome{display:flex;gap:23px;align-items:center;background:#e8eee3;padding:26px 32px;border-radius:15px;margin-bottom:80px}.welcome>span{font-size:44px;color:#a9775a}.welcome h2{font-size:26px;margin:0 0 8px}.welcome p{color:#5d7161;font-size:13px;margin:0}
    .category-banner{background:#e7eee4;padding:38px 0 45px}.back{border:0;background:none;color:#3f6b51;padding:0;font-weight:700;font-size:12px}.category-banner section{display:flex;justify-content:space-between;align-items:center}.category-banner h1{font-size:clamp(46px,6vw,72px);margin:13px 0}.category-banner p{font-size:14px;color:#687868;max-width:660px}.category-banner .big{font-size:92px}
    .listing{padding-top:38px;padding-bottom:75px;min-height:380px}.notice{background:#f0eee1;border-left:4px solid #bda477;padding:17px 22px;border-radius:8px;font-size:13px;line-height:1.6;color:#665f4d;margin-bottom:23px}.search{display:flex;align-items:center;width:min(100%,500px);background:white;border:1px solid var(--line);border-radius:12px;margin:8px 0 18px}.search span{font-size:28px;color:#68806e;padding-left:16px}.search input{border:0;background:transparent;width:100%;height:48px;padding:0 15px;outline:none}.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:23px}.filters button{border:1px solid #d8e2d5;background:white;border-radius:60px;padding:10px 15px;color:#55725c;font-size:12px}.filters button.active{color:white;background:var(--green);border-color:var(--green)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fffdf9;border:1px solid var(--line);border-radius:17px;padding:23px;display:flex;flex-direction:column;box-shadow:0 5px 22px #2646370a}.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:16px}.card-icon{display:grid;place-items:center;background:#f1f1e8;width:66px;height:66px;border-radius:17px;font-size:33px}.tag{font-size:11px;color:#56705b;background:#e9eee6;border-radius:25px;padding:6px 10px;font-weight:700}.card h3{font-size:26px;line-height:1.14;margin:0 0 10px}.loc{font-size:12px;color:#aa7659;margin-bottom:14px}.card p{font-size:13px;color:#617364;margin:0 0 12px}.card .extra{border-left:3px solid #c6b88f;padding:10px;background:#f4f2e9;font-size:12px}.card a{margin-top:auto;padding-top:15px;border-top:1px solid #e5e8de;text-decoration:none;color:#2b6247;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.card a:hover{text-decoration:underline}.empty{padding:65px 20px;text-align:center;background:white;border:1px dashed #ceddce;border-radius:18px;grid-column:1/-1}.empty span{font-size:36px}.empty h3{font-size:27px;margin:12px}.empty button{background:var(--green);color:white;border:0;padding:12px 19px;border-radius:50px}.hidden{display:none}
    footer{background:#1e4132;color:white;padding:35px 24px 23px}.footer-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:30px}.footer-inner h2{font-size:27px;margin:0}.footer-inner p{color:#d2e0d3;font-size:13px}.footnote{margin:25px auto 0;max-width:1100px;border-top:1px solid #ffffff25;padding-top:17px;color:#aac1af;font-size:11px}
    @media(max-width:850px){.cards,.tile-grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:52px}.hero-copy{padding:43px 7%}.hero-picture{min-height:430px}.header-label{display:none}}
    @media(max-width:560px){header{padding:17px 18px}.brand strong{font-size:24px}.brand small{font-size:9px}.hero{display:flex;flex-direction:column}.hero-picture{min-height:185px;height:185px}.hero-sun{width:120px;height:120px}.hero-tree{font-size:74px}.hero-tree.second{font-size:59px}.hero-welcome{font-size:59px}.hero-copy{padding:37px 26px 43px}.hero h1{font-size:48px;margin:14px 0}.hero-copy p{font-size:14px}.container{padding-left:17px;padding-right:17px}.intro{padding-top:50px}.tile-grid{gap:11px;margin-top:24px;margin-bottom:34px}.tile-art{height:100px;font-size:49px}.tile-body{padding:14px}.tile-body strong{font-size:20px}.tile-body span{font-size:11px}.welcome{margin-bottom:52px;padding:20px 16px;align-items:flex-start;gap:13px}.welcome>span{font-size:30px}.welcome h2{font-size:24px}.category-banner{padding:28px 0 32px}.category-banner h1{font-size:46px}.category-banner .big{font-size:55px}.cards{grid-template-columns:1fr}.listing{padding-top:24px;padding-bottom:50px}.footer-inner{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
<header><button class="brand" data-home aria-label="Accueil du guide"><span class="brand-logo">✿</span><span><strong>Les Jonquières</strong><small>Votre guide des Hautes-Vosges</small></span></button><span class="header-label">GERBÉPAL · VOSGES</span></header>
<nav aria-label="Rubriques"><div id="navigation" class="nav-inner"></div></nav>
<main id="app"></main>
<footer><div class="footer-inner"><div><h2>✿ Les Jonquières</h2><p>Votre petit guide de vacances à Gerbépal, près de Gérardmer.</p></div><div><strong>Une question ?</strong><p>Contactez votre hôte via votre messagerie de réservation.</p></div></div><div class="footnote">Guide public. Horaires, conditions d'ouverture et itinéraires à vérifier auprès des établissements et organismes officiels.</div></footer>
<script>
'use strict';
const groups=[
{id:'randos',name:'Randonnées',sub:'Lacs, forêts, cascades',icon:'🥾',description:'De belles balades à choisir selon le niveau et la météo.'},
{id:'auberges',name:'Fermes-auberges',sub:'Traditions vosgiennes',icon:'🍲',description:'Saveurs de montagne et cuisine traditionnelle.'},
{id:'restaurants',name:'Restaurants',sub:'Bonnes tables',icon:'🍽️',description:'Quelques adresses pour une sortie gourmande.'},
{id:'pluie',name:'Quand il pleut',sub:'Enfants et ados',icon:'☔',description:'Des activités à faire même quand le ciel est gris.'},
{id:'agenda',name:'Animations',sub:'Au fil des saisons',icon:'📅',description:'Les programmes actualisés par les organisateurs.'},
{id:'local',name:'Tout près du gîte',sub:'Produits et services',icon:'🍯',description:'Nos artisans et petits services à proximité.'}
];
const places=[
{c:'randos',name:'Tour du lac de Gérardmer',where:'Gérardmer',tag:'Facile',icon:'🌊',desc:'Environ 6 km autour du lac, une promenade incontournable à faire en famille.',url:'https://gerardmer.net/agenda.php',button:'Office de tourisme',extra:'Privilégiez les itinéraires balisés et vérifiez les conditions.'},
{c:'randos',name:'Le Saut des Cuves',where:'Gérardmer / Xonrupt-Longemer',tag:'Facile',icon:'💧',desc:'Un joli site sur la Vologne, entre rochers et forêt.',url:'https://www.google.com/maps/search/?api=1&query=Saut+des+Cuves+Xonrupt',button:'Voir sur la carte'},
{c:'randos',name:'Cascade et observatoire de Mérelle',where:'Gérardmer',tag:'Sportive',icon:'🌲',desc:'Sentier plus exigeant avec cascade et vues sur le lac. Certaines portions peuvent être raides et glissantes.',url:'https://www.google.com/maps/search/?api=1&query=Observatoire+de+Merelle+Gerardmer',button:'Localiser le départ'},
{c:'randos',name:'Le Gazon du Faing',where:'Le Valtin',tag:'Intermédiaire',icon:'⛰️',desc:'Promenade sur les hauteurs et les chaumes. Pensez au vent, à la météo et à la réglementation locale.',url:'https://www.google.com/maps/search/?api=1&query=Gazon+du+Faing',button:'Localiser'},
{c:'auberges',name:'Ferme-auberge de la Mexel',where:'Gérardmer',tag:'Cuisine vosgienne',icon:'🏡',desc:'Une adresse sur les hauteurs de Gérardmer pour découvrir l’ambiance des fermes-auberges.',url:'https://www.google.com/maps/search/?api=1&query=Ferme+Auberge+de+la+Mexel+Gerardmer',button:'Localiser',extra:'Vérifiez les horaires et réservez à l’avance.'},
{c:'auberges',name:'Auberge de Schmargult',where:'La Bresse',tag:'Montagne',icon:'🧀',desc:'Une étape en montagne pour les spécialités régionales et l’esprit marcaire.',url:'https://www.google.com/maps/search/?api=1&query=Auberge+Schmargult+La+Bresse',button:'Localiser',extra:'Ouverture saisonnière : renseignez-vous avant de monter.'},
{c:'restaurants',name:'La Géromoise',where:'Gérardmer',tag:'Brasserie',icon:'🍺',desc:'Brasserie artisanale dans un cadre chaleureux près du lac.',url:'https://www.google.com/maps/search/?api=1&query=La+Geromoise+Gerardmer',button:'Localiser'},
{c:'restaurants',name:'L’Hors du Temps',where:'Gérardmer',tag:'À deux',icon:'🥂',desc:'Pour une soirée autour d’une cuisine plus raffinée.',url:'https://www.google.com/maps/search/?api=1&query=L%27Hors+du+Temps+Gerardmer',button:'Localiser'},
{c:'restaurants',name:'Restaurants de Gérardmer',where:'Gérardmer',tag:'Toutes les envies',icon:'🍽️',desc:'La sélection actualisée de l’office de tourisme pour choisir selon vos envies.',url:'https://gerardmer.net/restaurants.php',button:'Explorer les tables'},
{c:'pluie',name:'Centre aquatique de Gérardmer',where:'Gérardmer',tag:'Famille',icon:'🏊',desc:'Une sortie à la piscine pour petits et grands. Consultez les horaires de la saison.',url:'https://gerardmer.net/famille-activites.php',button:'Infos activités'},
{c:'pluie',name:'Cinéma de Gérardmer',where:'Gérardmer',tag:'Famille',icon:'🎬',desc:'Une séance cinéma quand le temps ne permet pas de profiter de l’extérieur.',url:'https://gerardmer.net/cinema.php',button:'Programme'},
{c:'pluie',name:'Escape game',where:'Gérardmer',tag:'Ados',icon:'🧩',desc:'Des énigmes à résoudre en équipe, idéal avec de grands enfants ou des ados.',url:'https://www.google.com/maps/search/?api=1&query=Escape+game+Gerardmer',button:'Trouver une salle',extra:'Consultez les limites d’âge et réservez.'},
{c:'pluie',name:'Confiserie des Hautes-Vosges',where:'Plainfaing',tag:'Famille',icon:'🍬',desc:'Découvrir la fabrication de bonbons des Vosges, une idée gourmande par mauvais temps.',url:'https://www.google.com/maps/search/?api=1&query=Confiserie+des+Hautes+Vosges+Plainfaing',button:'Visite et itinéraire'},
{c:'agenda',name:'Animations à Gérardmer',where:'Office de tourisme Gérardmer Hautes Vosges',tag:'Agenda officiel',icon:'📅',desc:'Marchés, fêtes, spectacles, ateliers et événements de saison.',url:'https://gerardmer.net/agenda.php',button:'Voir l’agenda'},
{c:'agenda',name:'Programme de la MCL',where:'Gérardmer',tag:'Culture',icon:'🎭',desc:'Films et animations culturelles proposés par la Maison de la Culture et des Loisirs.',url:'https://www.mclgerardmer.fr/',button:'Voir le programme'},
{c:'agenda',name:'Animations à Saint-Dié',where:'Saint-Dié-des-Vosges',tag:'À découvrir',icon:'🎪',desc:'Pour compléter vos idées de sorties pendant le séjour.',url:'https://www.tourisme.saint-die-des-vosges.fr/',button:'Site de tourisme'},
{c:'local',name:'Le boulanger Louis',where:'24 route de la Basse, Gerbépal · env. 200 m du gîte',tag:'Pain artisanal',icon:'🥖',desc:'Du bon pain et des viennoiseries à deux pas du gîte.',extra:'Toute l’année : dimanche 7 h 30 à 12 h. En juillet–août : dimanche et mercredi, 8 h à 12 h. Téléphone : 06 48 00 41 50.',url:'tel:+33648004150',button:'Appeler Louis'},
{c:'local',name:'Miel de montagne de Gérardmer',where:'Disponible au gîte',tag:'10 € · 500 g',icon:'🍯',desc:'Un pot de miel de montagne à offrir ou à emporter chez soi.',extra:'En vente selon disponibilité. Renseignez-vous auprès de votre hôte.'},
{c:'local',name:'Baby-sitting avec Marie',where:'À son domicile, à proximité du gîte',tag:'Sur demande',icon:'🧸',desc:'Marie, assistante maternelle agréée depuis 11 ans, propose un service ponctuel de baby-sitting.',extra:'10 € / heure, selon disponibilités. Prestation indépendante de la location. Contactez votre co-hôte dans Airbnb.'}
];
const app=document.getElementById('app'),nav=document.getElementById('navigation');
let active=groups.some(g=>'#'+g.id===location.hash)?location.hash.slice(1):'home';
let filter='Toutes',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function navbar(){nav.innerHTML='<button data-home class="'+(active==='home'?'active':'')+'">⌂ Accueil</button>'+groups.map(g=>'<button data-category="'+g.id+'" class="'+(active===g.id?'active':'')+'">'+g.icon+' '+g.name+'</button>').join('');}
function tile(g){return '<button class="tile" data-category="'+g.id+'"><span class="tile-art">'+g.icon+'</span><span class="tile-body"><small>'+g.sub+'</small><strong>'+g.name+'</strong><span>Découvrir ↗</span></span></button>';}
function home(){return '<section class="hero"><div class="hero-picture"><div class="hero-sun"></div><div class="mountain"></div><div class="mountain two"></div><span class="hero-tree">🌲</span><span class="hero-tree second">🌲</span><span class="hero-welcome">🏡</span></div><div class="hero-copy"><small class="eyebrow">BIENVENUE DANS LES HAUTES-VOSGES</small><h1>Votre séjour,<br><em>vos découvertes.</em></h1><p>Balades, bonnes tables, activités en famille et petits plaisirs locaux : notre sélection pour découvrir les environs.</p><button class="cta" data-category="randos">Explorer les randonnées <span>→</span></button></div></section><section class="container intro"><span class="section-label">NOTRE CARNET D’ADRESSES</span><h2>Qu’avez-vous envie de faire <em>aujourd’hui ?</em></h2><p>Choisissez une rubrique pour trouver rapidement une idée de sortie.</p><div class="tile-grid">'+groups.map(tile).join('')+'</div><div class="welcome"><span>♡</span><div><h2>Un petit conseil</h2><p>Les horaires et les conditions d’accès changent parfois selon la saison. Vérifiez-les avant de partir et n’hésitez pas à demander des conseils à vos hôtes.</p></div></div></section>';}
function card(p){const action=p.url?'<a href="'+esc(p.url)+'" '+(p.url.startsWith('tel:')?'':'target="_blank" rel="noopener noreferrer"')+'>'+esc(p.button||'En savoir plus')+' <span>↗</span></a>':'';return '<article class="card"><div class="card-head"><span class="card-icon">'+esc(p.icon)+'</span><span class="tag">'+esc(p.tag)+'</span></div><h3>'+esc(p.name)+'</h3><div class="loc">⌖ '+esc(p.where)+'</div><p>'+esc(p.desc)+'</p>'+(p.extra?'<p class="extra">'+esc(p.extra)+'</p>':'')+action+'</article>';}
function results(){const p=places.filter(p=>p.c===active).filter(p=>filter==='Toutes'||p.tag===filter).filter(p=>(p.name+' '+p.where+' '+p.desc+' '+(p.extra||'')).toLowerCase().includes(query.trim().toLowerCase()));return p.length?p.map(card).join(''):'<div class="empty"><span>🔎</span><h3>Aucun résultat</h3><p>Essayez un autre mot ou un autre filtre.</p><button data-clear>Tout afficher</button></div>';}
function page(){const g=groups.find(x=>x.id===active);if(!g)return home();const filt=active==='randos'?['Toutes','Facile','Intermédiaire','Sportive']:active==='pluie'?['Toutes','Famille','Ados']:[];return '<div class="category-banner"><div class="container"><button class="back" data-home>← Retour au guide</button><section><div><span class="section-label">'+g.sub+'</span><h1>'+g.name+'</h1><p>'+g.description+'</p></div><span class="big" aria-hidden="true">'+g.icon+'</span></section></div></div><div class="container listing">'+(active==='randos'?'<div class="notice">🥾 Avant de partir : vérifiez la météo, l’état des sentiers et les fiches officielles. En hiver, certains parcours demandent des équipements spécifiques.</div>':'')+(active==='agenda'?'<div class="notice">📅 Les événements changent régulièrement : utilisez les liens vers les programmes actualisés.</div>':'')+'<label for="lookup" class="section-label">RECHERCHER DANS CETTE RUBRIQUE</label><div class="search"><span>⌕</span><input id="lookup" type="search" value="'+esc(query)+'" placeholder="Une activité, un lieu, un mot-clé…"></div>'+(filt.length?'<div class="filters">'+filt.map(f=>'<button data-filter="'+f+'" class="'+(filter===f?'active':'')+'">'+f+'</button>').join('')+'</div>':'')+'<div class="cards" id="cards">'+results()+'</div></div>';}
function render(){navbar();app.innerHTML=active==='home'?home():page();}
function openSection(id){active=groups.some(g=>g.id===id)?id:'home';filter='Toutes';query='';history.replaceState(null,'',active==='home'?location.pathname+location.search:'#'+active);render();window.scrollTo(0,0);}
document.addEventListener('click',event=>{const t=event.target.closest('[data-category]');if(t){openSection(t.dataset.category);return;}if(event.target.closest('[data-home]')){openSection('home');return;}const f=event.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}if(event.target.closest('[data-clear]')){filter='Toutes';query='';render();}});
document.addEventListener('input',event=>{if(event.target.id==='lookup'){query=event.target.value;document.getElementById('cards').innerHTML=results();}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active)openSection(id);});
render();
</script>
</body>
</html>
