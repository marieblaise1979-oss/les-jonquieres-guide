const app=document.getElementById('app'),nav=document.getElementById('navigation');
let active=location.hash==='#info'||groups.some(g=>'#'+g.id===location.hash)?location.hash.slice(1):'home';
let filter='Toutes',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function navbar(){nav.innerHTML=[['home','Accueil'],['randos','Balades'],['local','À proximité'],['info','Infos']].map(([id,name])=>'<button '+(id==='home'?'data-home':'data-category="'+id+'"')+' class="'+(active===id?'active':'')+'">'+name+'</button>').join('');}
function tile(g,i){return '<button class="tile" data-category="'+g.id+'"><span class="chapter">'+String(i+1).padStart(2,'0')+'</span>'+draw(g.id)+'<span class="tile-body"><strong>'+labels[i]+'</strong><small>'+g.sub+'</small><span class="arrow">↗</span></span></button>';}
function home(){return '<section class="intro"><h2>On fait quoi aujourd’hui ?</h2><label class="search">⌕ <input id="lookup" type="search" aria-label="Rechercher dans le carnet" placeholder="Une envie, un lieu, une recette…" value="'+esc(query)+'"></label><div id="home-menu" '+(query?'class="hidden"':'')+'><div class="tile-grid">'+groups.map(tile).join('')+'</div><button class="season" data-category="agenda">'+draw('agenda')+'<span><strong>Au fil des saisons…</strong><small>Marchés, fêtes et sorties du moment</small></span></button><p class="welcome">De belles découvertes vous attendent ! ♡</p></div><div class="cards" id="cards">'+(query?results():'')+'</div></section>';}
function card(p){const action=p.url?'<a href="'+esc(p.url)+'" '+(p.url.startsWith('tel:')?'':'target="_blank" rel="noopener noreferrer"')+'>'+esc(p.button||'En savoir plus')+' <span>↗</span></a>':'';return '<article class="card"><div class="card-head"><span class="card-icon">'+draw(p.c)+'</span><span class="tag">'+esc(p.tag)+'</span></div><h3>'+esc(p.name)+'</h3><div class="loc">⌖ '+esc(p.where)+'</div><p>'+esc(p.desc)+'</p>'+(p.extra?'<p class="extra">'+esc(p.extra)+'</p>':'')+action+'</article>';}
function results(){const p=places.filter(p=>(active==='home'||p.c===active)).filter(p=>filter==='Toutes'||p.tag===filter).filter(p=>(p.name+' '+p.where+' '+p.desc+' '+(p.extra||'')).toLowerCase().includes(query.trim().toLowerCase()));return p.length?p.map(card).join(''):'<div class="empty"><span>🔎</span><h3>Aucun résultat</h3><p>Essayez un autre mot ou un autre filtre.</p><button data-clear>Tout afficher</button></div>';}
function page(){const g=groups.find(x=>x.id===active);if(!g)return home();const filt=active==='randos'?['Toutes','Facile','Intermédiaire','Sportive']:active==='pluie'?['Toutes','Famille','Ados']:[];return '<div class="category-banner"><div class="container"><button class="back" data-home>← Retour au guide</button><section><div><span class="section-label">'+g.sub+'</span><h1>'+labels[groups.indexOf(g)]+'</h1><p>'+g.description+'</p></div><span class="big" aria-hidden="true">'+draw(g.id)+'</span></section></div></div><div class="container listing">'+(active==='randos'?'<div class="notice">🥾 Avant de partir : vérifiez la météo, l’état des sentiers et les fiches officielles. En hiver, certains parcours demandent des équipements spécifiques.</div>':'')+(active==='agenda'?'<div class="notice">📅 Les événements changent régulièrement : utilisez les liens vers les programmes actualisés.</div>':'')+'<label for="lookup" class="section-label">RECHERCHER DANS CETTE RUBRIQUE</label><div class="search"><span>⌕</span><input id="lookup" type="search" value="'+esc(query)+'" placeholder="Une activité, un lieu, un mot-clé…"></div>'+(filt.length?'<div class="filters">'+filt.map(f=>'<button data-filter="'+f+'" class="'+(filter===f?'active':'')+'">'+f+'</button>').join('')+'</div>':'')+'<div class="cards" id="cards">'+results()+'</div></div>';}
function render(){navbar();app.innerHTML=active==='home'?home():active==='info'?'<button class="back" data-home>← Retour au carnet</button><h1>Mes petites notes pratiques</h1><article class="card"><h3>Une question ?</h3><p>Contactez votre hôte via votre messagerie de réservation.</p><h3>Avant de partir…</h3><p>Vérifiez les horaires, la météo et les conditions d’accès.</p></article>':page();}
function openSection(id){active=id==='info'||groups.some(g=>g.id===id)?id:'home';filter='Toutes';query='';history.replaceState(null,'',active==='home'?location.pathname+location.search:'#'+active);render();window.scrollTo(0,0);}
document.addEventListener('click',event=>{const t=event.target.closest('[data-category]');if(t){openSection(t.dataset.category);return;}if(event.target.closest('[data-home]')){openSection('home');return;}const f=event.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}if(event.target.closest('[data-clear]')){filter='Toutes';query='';render();}});
document.addEventListener('input',event=>{if(event.target.id==='lookup'){query=event.target.value;document.getElementById('cards').innerHTML=active==='home'&&!query?'':results();const menu=document.getElementById('home-menu');if(menu)menu.classList.toggle('hidden',!!query);}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active)openSection(id);});
render();
</script>
</body>
</html>
